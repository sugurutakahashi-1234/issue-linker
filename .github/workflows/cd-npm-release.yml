# .github/workflows/cd-npm-release.yml
# Automatic release workflow using release-please
# Triggered on push to main branch
# Creates: Release PR → Git tag, GitHub release, npm package
name: npm Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  cd-npm-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.get_version.outputs.tag_name }}
    steps:
      - name: Release Please Action
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The following steps only run if a release was created
      - name: Checkout
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: Setup Bun
        if: ${{ steps.release.outputs.release_created }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun install

      - name: Check code quality
        if: ${{ steps.release.outputs.release_created }}
        run: bun run check

      - name: Build
        if: ${{ steps.release.outputs.release_created }}
        run: bun run build

      - name: Type check
        if: ${{ steps.release.outputs.release_created }}
        run: bun run typecheck

      - name: Check dependencies
        if: ${{ steps.release.outputs.release_created }}
        run: bun run knip

      - name: Test Coverage
        if: ${{ steps.release.outputs.release_created }}
        run: bun run test:coverage

      - name: E2E Tests
        if: ${{ steps.release.outputs.release_created }}
        run: bun run test:e2e

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: |
          for workspace in core cli; do
            archive="$RUNNER_TEMP/$workspace.tgz"
            (cd "packages/$workspace" && bun pm pack --filename "$archive")
            npm publish "$archive" --access public
          done

      - name: Get created tag
        if: ${{ steps.release.outputs.release_created }}
        id: get_version
        run: |
          # Get the version from package.json (which release-please just updated)
          VERSION=$(jq -r .version package.json)
          TAG_NAME="v${VERSION}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Created tag: ${TAG_NAME}"

  # Trigger post-release tasks
  trigger-post-release-tasks:
    needs: cd-npm-release
    if: ${{ needs.cd-npm-release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/ci-npm-released-tasks.yml
    secrets: inherit
